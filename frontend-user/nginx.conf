server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  charset utf-8;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location = /products { return 301 /services; }
  location ^~ /products/ { return 301 /services; }
  location = /cart { return 301 /service-booking; }
  location = /checkout { return 301 /service-booking; }
  location = /orders { return 301 /account?tab=services; }
  location ^~ /orders/ { return 301 /account?tab=services; }
  location = /policy/shipping { return 301 /policy/terms; }
  location = /policy/return { return 301 /policy/warranty; }
  location = /policy/returns { return 301 /policy/warranty; }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control 'public, immutable';
    add_header X-Content-Type-Options nosniff always;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control 'no-cache';
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
  }
}
